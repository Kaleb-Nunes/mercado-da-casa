name: Verificacao de seguranca - producao
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/hotfix-producao-20261120]
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar renderizacao, regras, cache e compatibilidade
        run: node tests/seguranca-producao.cjs
      - name: Firebase Firestore Emulator - 18 cenarios de acesso
        env:
          GCLOUD_PROJECT: demo-elida-acl
          CI: "true"
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase-tools@14.24.0 firebase@12.4.0 @firebase/rules-unit-testing@5.0.0
          npx firebase emulators:exec --only firestore --project demo-elida-acl "node tests/emulator-acesso.cjs"
