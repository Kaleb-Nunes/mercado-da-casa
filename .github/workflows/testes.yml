name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dieta, privacidade e homologação
        env:
          PRIVACIDADE_TERMOS: ${{ secrets.PRIVACIDADE_TERMOS }}
        run: node tests/rodar-testes.js
      - name: Segurança de acesso e cache
        run: node tests/rodar-seguranca.js
      - name: Entradas não confiáveis, imagens e links
        run: node tests/rodar-entradas-nao-confiaveis.cjs

      - name: Integração de login e criptografia
        run: |
          node tests/identidade-backup.cjs
          node tests/seguranca-identidade-backup.cjs
          node --test tests/aprovacao-acesso.cjs
          node --test tests/botoes-interface.cjs
          node --check elida-aprovacao.js
          node --check elida-conta.js

      - name: Validar backend seguro de famílias (sem deploy real)
        run: |
          node --check functions/index.js
          node --check functions/lib/validacao.cjs
          npm --prefix functions test

      - name: Testes reais de permissões (Firestore Emulator)
        env:
          GCLOUD_PROJECT: demo-elida-acl
          CI: "true"
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase-tools@14.24.0 firebase@12.4.0 @firebase/rules-unit-testing@5.0.0
          npx firebase emulators:exec --only firestore --project demo-elida-acl "node tests/emulator-acesso.cjs"
      - name: Rótulos reais (diagnóstico, não bloqueia)
        run: node tests/rodar-rotulos.js || true
      - name: Pacote de homologação
        run: |
          mkdir -p _homologacao
          cp -r index.html marca elida-entrada.js elida-entrada.css elida-app.js elida-backup-seguro.js elida-conta.js elida-aprovacao.js elida-supabase-config.js _headers ambiente.js dieta.js elida-regras.js elida-busca.js elida-ocr.js fonts sw.js manifest.webmanifest ofertas.json favicon.svg apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png vendor _homologacao/
      - uses: actions/upload-artifact@v4
        with:
          name: homologacao-${{ github.sha }}
          path: _homologacao
          retention-days: 14

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar controle do Chrome
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
      - name: Exercitar botões e formulários no Chromium real, sem credenciais
        run: node tests/browser-botoes.cjs
      - name: Guardar relatório e captura em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-chromium-botoes-${{ github.sha }}
          path: qa-resultados/
          if-no-files-found: ignore
          retention-days: 7

  elida-ia:
    # Pipeline separado: Elida IA (regras, busca, leitura de rótulo por foto). Não afeta o Elida Familiar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Elida IA · regras, formulário, gatilhos e armazenamento
        run: |
          node tests/rodar-regras.js | tee relatorio-elida-ia.txt
          node tests/rodar-busca.js | tee -a relatorio-elida-ia.txt
          node tests/rodar-ambiente.js | tee -a relatorio-elida-ia.txt
          node tests/rodar-ocr.js | tee -a relatorio-elida-ia.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elida-ia-${{ github.sha }}
          path: relatorio-elida-ia.txt
          retention-days: 14

  auditoria-publica-passiva:
    # Sem ataques ao servidor: 3 HEAD + 3 GET públicos, somente metadados.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditar headers HTTP e configuração visível nas três páginas
        run: node tests/auditar-superficie-publica.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-http-${{ github.sha }}
          path: auditoria-seguranca/auditoria-passiva-publica.json
          retention-days: 14

  zap-passivo-producao:
    # Somente o PR de segurança. Scanner passivo autorizado, sem fuzzing/ataques ativos.
    if: github.event_name == 'pull_request' && github.head_ref == 'security/elida-acesso-familiar-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP Baseline (passivo, spider 1 minuto)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://kaleb-nunes.github.io/mercado-da-casa/
          cmd_options: '-m 1'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-passivo-elida-${{ github.sha }}

