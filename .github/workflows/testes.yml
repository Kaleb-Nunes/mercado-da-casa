name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dieta, privacidade e homologação
        env:
          PRIVACIDADE_TERMOS: ${{ secrets.PRIVACIDADE_TERMOS }}
        run: node tests/rodar-testes.js
      - name: Rótulos reais (diagnóstico, não bloqueia)
        run: node tests/rodar-rotulos.js || true
      - name: Pacote de homologação
        run: |
          mkdir -p _homologacao
          cp -r index.html dieta.js sw.js manifest.webmanifest ofertas.json favicon.svg apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png vendor _homologacao/
      - uses: actions/upload-artifact@v4
        with:
          name: homologacao-${{ github.sha }}
          path: _homologacao
          retention-days: 14

  elida-ia:
    # Pipeline separado: motor de regras do Elida IA (Marco 1). Não afeta o Elida Familiar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Elida IA · regras, formulário, gatilhos e armazenamento
        run: node tests/rodar-regras.js | tee relatorio-elida-ia.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elida-ia-${{ github.sha }}
          path: relatorio-elida-ia.txt
          retention-days: 14
