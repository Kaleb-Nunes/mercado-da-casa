name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dieta, privacidade e homologação
        env:
          PRIVACIDADE_TERMOS: ${{ secrets.PRIVACIDADE_TERMOS }}
        run: node tests/rodar-testes.js
      - name: Segurança de acesso e cache
        run: node tests/rodar-seguranca.js
      - name: Bloquear segredos e arquivos privados no Git e histórico
        run: node tests/segredos-git.cjs
      - name: Entradas não confiáveis, imagens e links
        run: node tests/rodar-entradas-nao-confiaveis.cjs

      - name: Integração de login e criptografia
        run: |
          node tests/identidade-backup.cjs
          node tests/seguranca-identidade-backup.cjs
          node tests/aprovacao-acesso.cjs

      - name: Validar backend seguro de famílias (sem deploy real)
        run: |
          node --check functions/index.js
          node --check functions/lib/validacao.cjs
          node --check functions/lib/acesso.cjs
          node --check functions/scripts/provisionar-superadmin.cjs
          node --check elida-aprovacao.js
          npm --prefix functions test

      - name: Testes reais de permissões (Firestore Emulator)
        env:
          GCLOUD_PROJECT: demo-elida-acl
          CI: "true"
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase-tools@14.24.0 firebase@12.4.0 @firebase/rules-unit-testing@5.0.0
          npx firebase emulators:exec --only firestore --project demo-elida-acl "node tests/emulator-acesso.cjs"
      - name: Rótulos reais (diagnóstico, não bloqueia)
        run: node tests/rodar-rotulos.js || true
      - name: Pacote de homologação
        run: |
          mkdir -p _homologacao
          cp -r index.html elida-app.js elida-backup-seguro.js elida-aprovacao.js elida-conta.js elida-firebase-config.js _headers ambiente.js dieta.js elida-regras.js elida-busca.js elida-ocr.js fonts sw.js manifest.webmanifest ofertas.json favicon.svg apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png vendor _homologacao/
      - uses: actions/upload-artifact@v4
        with:
          name: homologacao-${{ github.sha }}
          path: _homologacao
          retention-days: 14

  elida-ia:
    # Pipeline separado: Elida IA (regras, busca, leitura de rótulo por foto). Não afeta o Elida Familiar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Elida IA · regras, formulário, gatilhos e armazenamento
        run: |
          node tests/rodar-regras.js | tee relatorio-elida-ia.txt
          node tests/rodar-busca.js | tee -a relatorio-elida-ia.txt
          node tests/rodar-ambiente.js | tee -a relatorio-elida-ia.txt
          node tests/rodar-ocr.js | tee -a relatorio-elida-ia.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elida-ia-${{ github.sha }}
          path: relatorio-elida-ia.txt
          retention-days: 14

  auditoria-publica-passiva:
    # Sem ataques ao servidor: 3 HEAD + 3 GET públicos, somente metadados.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditar headers HTTP e configuração visível nas três páginas
        run: node tests/auditar-superficie-publica.cjs
      - name: Verificar CORS, CSP e cache em homologação
        run: node tests/cors-cache-hml.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-http-${{ github.sha }}
          path: auditoria-seguranca/auditoria-passiva-publica.json
          retention-days: 14

  zap-passivo-producao:
    # Somente o PR de segurança. Scanner passivo autorizado, sem fuzzing/ataques ativos.
    if: github.event_name == 'pull_request' && github.head_ref == 'security/elida-acesso-familiar-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP Baseline (passivo, spider 1 minuto)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://kaleb-nunes.github.io/mercado-da-casa/
          cmd_options: '-m 1'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-passivo-elida-${{ github.sha }}

  interface-real:
    name: Botões e formulários em Chromium real
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium webkit
      - name: Testar cliques e formulários com servidor local (390px e 375px)
        run: python tests/ui-interacoes.py
      - name: Aguardar disponibilização da prévia Cloudflare desta branch
        run: |
          for n in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 8 https://feature-elida-aprovacao-admi.elida-homologacao.pages.dev/elida-aprovacao.js | grep -q ElidaAprovacao; then
              exit 0
            fi
            sleep 5
          done
          echo "Prévia Cloudflare ainda não publicou o módulo de autorização"
          exit 1
      - name: Testar botões na prévia real Cloudflare (aprovação)
        env:
          ELIDA_QA_BASE: https://feature-elida-aprovacao-admi.elida-homologacao.pages.dev/
        run: python tests/ui-interacoes.py
      - name: Testar botões na prévia Elida IA anterior informada ao usuário
        env:
          ELIDA_QA_BASE: https://release-elida-ia-familias-ca.elida-homologacao.pages.dev/
          ELIDA_QA_REQUIRE_ADMIN: '0'
        run: python tests/ui-interacoes.py
      - name: Safari WebKit - testar toques e formulários localmente
        env:
          ELIDA_QA_BROWSER: webkit
        run: python tests/ui-interacoes.py
      - name: Safari WebKit - testar toques na prévia online
        env:
          ELIDA_QA_BROWSER: webkit
          ELIDA_QA_BASE: https://feature-elida-aprovacao-admi.elida-homologacao.pages.dev/
        run: python tests/ui-interacoes.py
      - name: Evidências de falhas de interface
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elida-falhas-botoes-${{ github.sha }}
          path: qa-evidencias
          retention-days: 7

  pentest-passivo-homologacao:
    name: OWASP ZAP - auditoria passiva em ambiente de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Aguardar prévia de homologação da branch
        run: |
          for n in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 8 https://feature-elida-aprovacao-admi.elida-homologacao.pages.dev/elida-aprovacao.js | grep -q ElidaAprovacao; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: OWASP ZAP - spider limitado, apenas análise passiva, sem credenciais
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://feature-elida-aprovacao-admi.elida-homologacao.pages.dev/
          cmd_options: '-m 1 -T 2'
          allow_issue_writing: false
          fail_action: false
          artifact_name: elida-zap-passivo-${{ github.sha }}
