<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elida">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Elida</title>
<link rel="stylesheet" href="elida-entrada.css">
<link rel="preload" href="fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fontes no próprio site (licença SIL OFL, em fonts/): nada é pedido ao Google e funciona offline. */
@font-face{font-family:"Fraunces";src:url(fonts/fraunces.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Onest";src:url(fonts/onest.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* Layout: cartão-saldo verde no topo, listas limpas em superfícies claras, barra inferior com botão + central */
  --bg:#F1F3EF;
  --surface:#FFFFFF;
  --ink:#10261F;
  --muted:#5F6C66;
  --line:#E1E6E0;
  --hero:#0F3B2E;
  --hero-ink:#F4F1E6;
  --hero-muted:#A9BDB3;
  --brass:#B8892B;
  --brass-hero:#D9B45A;
  --good:#2A7550;
  --good-soft:#E3F1E8;
  --warn:#A94E18;
  --warn-soft:#FBE8DC;
  --shadow:0 1px 2px rgba(16,38,31,.06),0 8px 24px rgba(16,38,31,.06);
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411; --surface:#121D19; --ink:#E9EEE9; --muted:#93A39B; --line:#22302A;
    --hero:#143D30; --hero-ink:#F4F1E6; --hero-muted:#9DB5A9; --brass:#D9B45A; --brass-hero:#E2C06A;
    --good:#5CC08D; --good-soft:#163024; --warn:#F08A4B; --warn-soft:#3A2116;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#121D19; --ink:#E9EEE9; --muted:#93A39B; --line:#22302A;
  --hero:#143D30; --hero-ink:#F4F1E6; --hero-muted:#9DB5A9; --brass:#D9B45A; --brass-hero:#E2C06A;
  --good:#5CC08D; --good-soft:#163024; --warn:#F08A4B; --warn-soft:#3A2116;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estrutura ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 4px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;flex:none;border-radius:8px;box-shadow:0 2px 6px rgba(15,59,46,.18)}
.brand-word > span{color:var(--brass)}
.top-note{font-size:12px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:8px 16px 24px}
.view{display:none;flex-direction:column;gap:20px}
.view.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.title{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.section{display:flex;flex-direction:column;gap:10px}
.s-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.s-title{font-weight:700;font-size:15px}
.s-meta{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}

/* ---------- Mês ---------- */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.round svg{width:18px;height:18px}
.round:disabled{opacity:.35;cursor:default}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px 22px 20px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(15,59,46,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(217,180,90,.25)}
.hero::before{content:"";position:absolute;right:-20px;top:-100px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(217,180,90,.15)}
.h-label{font-size:13px;color:var(--hero-muted);letter-spacing:.02em}
.h-big{font-family:var(--font-display);font-weight:600;font-size:52px;line-height:1.02;letter-spacing:-.025em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.h-big small{font-size:24px;font-weight:500;margin-right:4px;color:var(--hero-muted)}
.h-big.neg{color:#F6B48C}
.h-line{font-size:14px;color:var(--hero-muted)}
.h-line b{color:var(--hero-ink);font-weight:600}
.h-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin:16px 0 12px;overflow:hidden}
.h-bar i{display:block;height:100%;border-radius:99px;background:var(--brass-hero);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.h-bar.over i{background:#F08A4B}
.h-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h-tip{font-size:14px;color:var(--hero-ink)}
.h-edit{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--hero-ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-align:left;box-shadow:var(--shadow)}
.qbtn .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--good-soft);color:var(--good);flex:none}
.qbtn .ic svg{width:20px;height:20px}
.qbtn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}

.rows{list-style:none;margin:0;padding:6px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;background:none;border:0;text-align:left;border-top:1px solid var(--line)}
.rows li:first-child .row{border-top:0}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--good-soft);color:var(--good)}
.r-main{flex:1;min-width:0}
.r-name{display:block;font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.r-meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.r-val{font-family:var(--font-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.r-val small{font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--muted);display:block}
.empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{width:56px;height:56px;color:var(--brass);margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bars{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.bar-row .t{height:6px;border-radius:99px;background:var(--line);grid-column:1/-1;overflow:hidden}
.bar-row .t i{display:block;height:100%;border-radius:99px;background:var(--brass)}
.tip{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tip ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip .x{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:0 4px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end;text-decoration:underline;text-underline-offset:3px}
.safe{display:flex;gap:12px;align-items:flex-start}
.safe svg{width:22px;height:22px;color:var(--good);flex:none;margin-top:2px}
.safe p{margin:0;font-size:14px;color:var(--muted)}
.safe b{color:var(--ink)}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.link{background:none;border:0;padding:0 2px;min-height:44px;display:inline-flex;align-items:center;color:var(--good);font-weight:600;font-size:14px;text-decoration:none}

/* ---------- Preços ---------- */
.searchbox{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 4px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.btn-sm{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.btn-sm svg{width:16px;height:16px}
.var{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.var.up{background:var(--warn-soft);color:var(--warn)}
.var.down{background:var(--good-soft);color:var(--good)}
.in-list{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass);margin-left:6px;vertical-align:1px}

/* ---------- Lista ---------- */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.sum div{background:var(--surface);padding:14px 16px}
.sum span{font-size:12px;color:var(--muted);display:block}
.sum b{font-family:var(--font-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sum .cart b{color:var(--good)}
.litem{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rows li:first-child .litem{border-top:0}
/* O botão tem 44px para o dedo; a margem negativa mantém o desenho e o espaço de 28px. */
.check{width:44px;height:44px;margin:-8px;border:0;background:none;display:grid;place-items:center;padding:0;position:relative;border-radius:12px}
.check::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid var(--line);background:var(--surface);transition:all .2s ease}
.stepper button::after{content:"";position:absolute;inset:-8px} /* área de toque de 44px sem mudar o desenho */
.check svg{width:16px;height:16px;opacity:0;color:#fff;position:relative}
.check.on::before{background:var(--good);border-color:var(--good)}
.check.on svg{opacity:1}
.litem.done .r-name{text-decoration:line-through;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:2px;margin-top:6px;border:1px solid var(--line);border-radius:99px;padding:2px}
.stepper button{width:28px;height:28px;border-radius:50%;border:0;background:var(--bg);font-weight:700;font-size:16px;line-height:1;position:relative}
.stepper span{min-width:44px;text-align:center;font-size:13px;font-weight:600}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:16px;border:0;background:var(--hero);color:var(--hero-ink);font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 8px 20px rgba(15,59,46,.22)}
.bigbtn svg{width:20px;height:20px}
.bigbtn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.bigbtn.wa{background:#1B7F4D;color:#fff;box-shadow:none}
.quiet{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px;align-self:center}
.quiet.armed{color:var(--warn)}

/* ---------- Rótulo ---------- */
.alert{background:var(--warn);color:#fff;border-radius:20px;padding:18px}
.alert b{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:4px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{font-size:14px;font-weight:600;padding:6px 11px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.word.ok{background:var(--good-soft);color:var(--good)}
.card h3{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:19px}
.card p{margin:0;font-size:15px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}

.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.flag-line{font-size:12px;font-weight:700;color:var(--warn);margin-top:4px}
.flag.ok{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.flag.q{background:transparent;color:var(--muted);border:1px solid var(--line)}
.diet-line{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.diet-line.ok{color:var(--ink)}
.dbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dbox b{font-weight:700}
.dbox span{color:var(--muted);font-size:13px}
.dbox.no{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dbox.no span{color:inherit;font-weight:500}
.dbox.ok{border-color:var(--ink)}
.word.neutro{background:transparent;color:var(--muted);border:1px solid var(--line)}
.dbox .quiet{align-self:flex-start;padding:2px 0}
.aviso-fixo{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding:6px 10px;margin:4px 0 0}
.estados{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.estados li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.estados .flag{margin-left:0;flex:none;margin-top:2px}
.g-title{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.hml-bar{background:#7A2E0E;color:#FFF4EC;font-size:13px;font-weight:700;text-align:center;padding:6px 12px}
.hml-bar[hidden]{display:none}
.hml-btn{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.warnbox[hidden]{display:none}
/* Elida IA: perfis e rótulos */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;margin:0 0 14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:99px;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-current=page]{background:var(--hero);color:var(--hero-ink)}
.ia-op{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}
.ia-op input{width:22px;height:22px;flex:none;accent-color:var(--hero)}
.ia-sit{margin:0 0 8px 32px}
.ia-erro{color:#9B2C2C;font-size:14px;font-weight:600;margin:4px 0 0}
.ia-erro[hidden]{display:none}
.ia-lista{border:1px solid var(--line);margin:0 0 10px;padding:4px 14px}
.ia-perfil{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.ia-perfil:first-of-type{border-top:0}
.ia-perfil small,.ia-prod small{color:var(--muted)}
.ia-acoes{display:flex;gap:12px}
.ia-vazio{padding:16px;display:flex;flex-direction:column;gap:8px}
.ia-busca label{font-size:13px;font-weight:600;color:var(--muted)}
.ia-linha{display:flex;gap:8px;margin-top:4px}
.ia-linha .inp{flex:1}
.ia-h{font-size:16px;margin:16px 0 4px}
.ia-prod{padding:14px;margin:10px 0}
.ia-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ia-det{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ia-fonte{font-size:13px;color:var(--muted);margin:8px 0 0}
.ia-chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.ia-INCOMPATIVEL_IDENTIFICADO,.ia-POSSIVEL_CONTAMINACAO{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.ia-REQUER_ORIENTACAO_PROFISSIONAL{background:#FFF4D6;color:#6B5310;border-color:#B08A1E}
.ia-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:#FFF4D6;color:#6B5310;border:1px solid #B08A1E;margin-left:6px}
.ia-fontes{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:10px 0}.ia-fontes legend{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.ia-ev{font-size:12px;color:var(--muted);word-break:break-word}
.ia-duv{font-size:13px;background:#FFF4D6;color:#6B5310;border-radius:10px;padding:8px 10px;margin:4px 0}
#ocr-status{display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:14px}
.ia-dl{font-size:14px;margin:12px 0}.ia-dl dt{font-weight:700;margin-top:8px}.ia-dl dd{margin:2px 0 0}
textarea.inp.txt{font-family:var(--font-body);font-size:15px;height:110px;line-height:1.4}
.tip .act{align-self:flex-start;background:var(--hero);color:var(--hero-ink);border:0;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}

.thumb,.emo,.avatar.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--bg);border:1px solid var(--line);font-size:24px;line-height:1;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.lg{width:76px;height:76px;font-size:42px;border-radius:20px}

.mk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#F4F1E6;font-family:var(--font-display);font-weight:600;font-size:17px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}

.chg{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line);font-size:15px}

.up{color:var(--warn)}

.cheap-line{font-size:12px;font-weight:700;color:var(--good);margin-top:4px}

/* ---------- Ofertas ---------- */
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:2px 0 6px;color:var(--muted);font-weight:600;font-size:14px}
.back svg{width:18px;height:18px}
.ofcard{display:flex;flex-direction:column;gap:10px;padding:16px 18px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.of-line{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4}
.of-line .ti{font-size:20px;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.of-go{font-size:13px;font-weight:700;color:var(--good)}
.today{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--good-soft)}
.today .ti{font-size:24px;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.today b{display:block;font-size:15px}
.today span{font-size:14px;color:var(--muted)}
.enc{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.rows li:first-child .enc,.rows li:first-child .ofrow,.rows li:first-child .rot{border-top:0}
.enc .go{font-weight:700;font-size:13px;color:var(--good);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.pill.hot{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.ofrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.of-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.of-de{font-size:12px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.of-add{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.of-add.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.of-cmp{font-size:12px;font-weight:700;margin-top:4px}
.of-cmp.good{color:var(--good)}
.of-cmp.bad{color:var(--warn)}
.rot{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 18px;border-top:1px solid var(--line);font-size:14px}
.rot .ti{grid-row:span 2;font-size:20px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rot b{font-size:15px}
.rot span{color:var(--muted)}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}

/* ---------- Tempo real ---------- */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:0;background:var(--good-soft);color:var(--good);white-space:nowrap}

.live.off{background:var(--warn-soft);color:var(--warn)}

.live.wait{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.live.wait i{background:var(--brass)}
.rt-card{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}

.rt-actions .btn-sm{box-shadow:none}
.membros{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.membros li{display:flex;align-items:center;gap:10px;font-size:15px}
.membros li small{color:var(--muted);font-size:13px}
.linkbox{font-size:13px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}

/* ---------- Barra inferior ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end
}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}

.fab{justify-self:center;width:58px;height:58px;border-radius:20px;border:0;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;margin-bottom:6px;box-shadow:0 10px 24px rgba(15,59,46,.35);transform:translateY(-8px)}
.fab svg{width:26px;height:26px}

/* ---------- Folha (bottom sheet) ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,11,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;background:var(--surface);

}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sh-close{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center;color:var(--muted);z-index:2}
.sh-title{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-.01em;margin:0;padding-right:40px}
.sh-sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.form{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.money{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}

.money span{font-family:var(--font-display);font-size:24px;color:var(--muted)}
.money input{border:0;outline:none;background:transparent;font-family:var(--font-display);font-weight:600;font-size:44px;width:100%;min-width:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fl{display:flex;flex-direction:column;gap:6px}

.inp{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:16px;width:100%;outline:none}

textarea.inp{height:140px;padding:12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.sh-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
